name: Deploy Admin Panel (Staging S3)

on:
  push:
    branches:
      - stage

jobs:
  build_and_deploy:
    name: Build & Deploy to AWS S3 (Stage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Create Staging .env.staging file
        run: |
          cat > .env.staging <<EOF
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL_STAGE || 'https://api-stage-mayiliragu.sathishdev.in/api' }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'mayiliraguacadamy.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID || 'mayiliraguacadamy' }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'mayiliraguacadamy.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '388970099836' }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID || '1:388970099836:web:f7903ff35796c8c86745f9' }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-XX7NPPNY1F' }}
          EOF

      - name: Build Admin Panel for Staging
        run: npm run build:stage

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy static files to AWS S3 bucket (mayiliragu-admin-stage)
        run: |
          aws s3 sync dist/ s3://mayiliragu-admin-stage --delete
          echo "✔ Admin Panel Staging deployed to s3://mayiliragu-admin-stage"
